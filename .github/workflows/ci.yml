name: Validate and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: country-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Validate release tag and ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node scripts/check-release.mjs
          git merge-base --is-ancestor HEAD origin/main
      - name: Verify release tarball
        if: matrix.node == 24
        run: npm run test:package -- --candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.node == 24
        with:
          name: verified-package
          if-no-files-found: error
          path: artifacts/
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
          scope: '@avgeek-oss'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-package
          path: artifacts/
      - run: node scripts/check-release.mjs --candidate
      - name: Publish verified tarball with OIDC
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          npm publish "./artifacts/avgeek-oss-country-data-${VERSION}.tgz" --ignore-scripts --access public --registry=https://registry.npmjs.org
      - name: Check registry integrity
        run: node scripts/check-release.mjs --published
      - run: npm ci --ignore-scripts
      - name: Verify fresh registry consumer
        run: npm run test:published
